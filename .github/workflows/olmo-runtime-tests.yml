name: OLMo runtime tests

on:
  push:
    branches: [main, olmo-adaptation]
    paths:
      - "olmo/**"
      - ".github/workflows/olmo-runtime-tests.yml"
  pull_request:
    paths:
      - "olmo/**"
      - ".github/workflows/olmo-runtime-tests.yml"
  workflow_dispatch:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test output validation (no model download)
        run: PYTHONPATH=olmo python -m unittest discover -s olmo -v
